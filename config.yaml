# PXAI 半导体知识库 · 全局配置
project:
  name: semi-kb
  display_name: 半导体前段厂/后段厂知识库
  layer_scope: [ontology, knowledge_base]   # 本期只做四层链路的前两层
  domains: [core, fab, ap]
  version: "0.1.0"

paths:
  meta_schema: ontology/meta-schema.yaml
  ontology_root: ontology
  kb_root: kb
  build_root: build
  changesets: changesets

# ---------------------------------------------------------------
# 自动更新的审核策略
# 无人值守地改 schema 会导致概念重复、层级错乱、旧实例失配，
# 因此按变更类型分级放行。apply_changeset.py --no-review 可整体覆盖。
# ---------------------------------------------------------------
review:
  # 无人值守模式。每日定时任务自跑，实体/关系/实例都自动合并。
  # 护栏改由 daily-refresh 那一层兜：git 快照 + 校验 + 双份问题夹具回归，
  # 任一环失败整次回滚。单条审核换成了整次可回退，不是取消了审核。
  mode: auto                # manual | auto
  auto_apply:
    instances: true         # 新增知识库实例
    entities: true          # 新增本体实体
    relations: true         # 新增关系
    schema: true            # 改元模型也自动放行。代价是 schema 漂移不再有人眼兜底，
                            # 唯一的回退是整次 git revert——所以 verdict 里要单独标出 schema 改动
  guards:
    min_confidence: medium  # 低于此可信度的条目拦下，留在 pending/ 等下一轮
    max_auto_entities: 30   # 单个 changeset 自动放行的实体上限
    require_ref_for_web: true
    # verdict 文件写在 changesets/verdicts/<提案名>.verdict.yaml，
    # apply_changeset.py 只读结论、不自己判断，因此 apply 仍是确定性的、
    # 可离线复跑的。缺 verdict 一律不合并：没被审过 != 审过且通过。
    #
    # 审核方式：precheck.py 承担确定性检查，需要判断的部分自审，
    # 并在 verdict 的 verifier 字段标 self:*。
    # 代价要清楚——自审没有第二双眼睛，同一段上下文里边写边审有盖章通过的
    # 倾向。缓解办法是把能判定的规则持续往 precheck.py 里沉淀，
    # 让"需要判断"的面积越来越小。verifier 必须诚实标 self，
    # 假装独立审过比自审更糟。
    #
    # 注：changesets/verdicts/ 下早期几份 verdict 的 verifier 记的不是 self，
    # 那是当时的真实审核方，属审计记录，不改。
    require_verdict: true
    # 无人值守专属护栏，由 daily_refresh.py 执行（apply_changeset.py 不读这几项）
    max_entities_per_day: 25    # 单日净增实体上限，防一次跑飞把库冲垮
    max_growth_ratio: 0.15      # 单日净增不得超过现有规模的比例
    require_regress_pass: true  # 回归不过就整次回滚
    require_git_clean: true     # 开跑前工作区必须干净，否则没有干净的回滚点

# 知识来源（本项目无内部数据接口）
sources:
  model_prior: {enabled: true,  note: "模型预训练的半导体制造知识"}
  analogy:     {enabled: true,  note: "跨行业类比推演，落盘为 analogous_to 关系"}
  web:         {enabled: true,  note: "公网公开资料，必须记录 URL"}
  internal_api: {enabled: false, note: "暂无内部接口"}

validate:
  fail_on: [error]          # warn 不阻断构建
  low_confidence_ratio_warn: 0.4
