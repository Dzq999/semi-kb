      不适用情形（剖面形状已改变时补偿只能移动整体水平、改不回形状）——
      这条限制是本边最有价值的部分。model_prior/high。

  - key: "fab.anomaly.film_thickness_dev|mitigated_by|fab.action.replace_consumable"
    section: relations
    verdict: pass
    reason: >-
      端点类型合法。既有动作 description 已列靶材为寿命件，复用正确。
      note 限定"参数补偿无法回复剖面时"，与 recipe_adjust 构成升级顺序而非
      并列选项，kb 的 order 3→4 与此一致。model_prior/high。

  - key: "fab.anomaly.film_thickness_dev|mitigated_by|fab.action.hold_lot"
    section: relations
    verdict: pass
    reason: >-
      端点类型合法。与库内其他异常一致的兜底动作（根因未明前先扣留），
      kb 里排 order 1。model_prior/high。

  - key: "fab.anomaly.film_thickness_dev|blocks|fab.process.cmp_metal"
    section: relations
    verdict: pass
    reason: >-
      本条是自审中改过的一处，记录原因以免后来者以为是笔误：初稿写的是
      blocks -> fab.process.photo_coat，理由写成"不应进入下一层图形化"。
      核对 precedes 链后确认这是错的——主流程上 photo_coat 位于
      lpcvd_nitride 之后、ALD/PVD 之前，是沉积段的**上游**而非下游。
      Route 是单遍线性表达，不含多层循环，所以"下一层"在图上不存在，
      那条边会把一条不存在的阻塞关系写进本体。
      改为 cmp_metal：precedes 链上 pvd_metal -> cmp_metal 是直接后续，
      且阻塞理由是实的——CMP 去除量按来料厚度设定，入料厚度未判定就抛光，
      偏移会转成抛后剩余厚度偏差且不可回补。
      端点类型合法（Anomaly -> Process）。model_prior/medium：阻塞与否是
      工厂规则而非物理必然，不标 high。

  - key: "fab.anomaly.film_thickness_dev|blocks|fab.process.cmp_oxide"
    section: relations
    verdict: pass
    reason: >-
      cvd_ild 侧的对应边。precedes 链是 cvd_ild -> furnace_anneal -> cmp_oxide，
      cmp_oxide 不是直接后续但是第一个厚度敏感的去除工序，阻塞点设在这里
      而非退火上是对的——退火不改变厚度判定的可挽回性，抛光会。
      端点类型合法。model_prior/medium 同上。

  - key: "fab.anomaly.film_thickness_dev|refines|core.anomaly.quality_excursion"
    section: relations
    verdict: pass
    reason: >-
      端点类型合法（Anomaly -> Anomaly，refines 允许）。与库内既有模式一致：
      cd_out_of_spec 与 particle_excursion 都 refines 到 quality_excursion。
      这条边同时是 core 层骨架接入，validate 的 R 系列规则要求 fab/ap 异常
      归入 core 骨架。model_prior/high。

  - key: "fab.anomaly.film_thickness_dev|analogous_to|ext.coating.coat_weight_deviation"
    section: relations
    verdict: pass
    reason: >-
      目标用 ext.* 前缀，符合 id_rules（ext 允许悬空引用，不参与本地解析校验）。
      类比不是装饰：note 写清共性（沉积源几何 + 耗材侵蚀状态 + 预处理三者
      决定横向分布）与可复用经验（先看剖面形状再看均值的判别顺序、
      预处理省不掉），符合 SKILL.md 对 analogous_to 的要求。
      confidence 改过一次，记录理由：初稿标 low，依据是"ext 端豁免本地解析、
      这条边对不对无法校验"。核对库内既有 analogous_to 边后确认这是把两件事
      混了——既有 6 条边全部标 medium 或 high，而 ext 端同样不可校验，
      可见本库的约定是 confidence 表达"类比映射本身有多强"，不表达
      "目标端能不能验"。后者是 project-notes 已记的全库性缺口
      （"跨行业类比只有一端"），不该按边重复计价。
      按这个口径重判为 medium：共性是结构性的（沉积源几何 + 耗材侵蚀状态 +
      预处理三者决定横向分布），与既有 medium 边（如洁净室温控 ↔ 大棚温控）
      的强度相当，但未真正打通对端本体，故不取 high。
      顺带说明 guards.min_confidence 为 medium，原先的 low 会被拦下——
      但改动理由是口径错了，不是为了过闸门；若判定确实该是 low，
      正确做法是让它留在 pending 而非抬高标注。

  - key: "kb.fab.film_thickness_dev_triage"
    section: kb_cases
    verdict: pass
    reason: >-
      本条初稿漏了 required 字段 provenance。precheck 没报——它只查外形不查
      字段；apply 的 dry-run 把"缺 provenance"读成 confidence 缺失、按低于
      门槛拦下，才暴露出来。已补 web/medium，与 anomaly 实体一致。
      记下这条是因为它说明了两层闸门的分工：字段级遗漏要到 apply 或 validate
      才现形，precheck 通过不等于内容完整。
      precheck 另 warn 本条引用了同提案新增的 4 个实体，会被转人工——这是
      预期行为。config.review.mode 为 auto 且 auto_apply 全开，实体与本条
      在同一次 apply 内按 entities -> relations -> kb_cases 顺序合并，
      被依赖项先落库，因此本条不会因顺序问题被拦。
      字段完整性对照 kb_schema 逐项核过：required 的 id/domain/title/
      anomaly_ref/symptoms/possible_causes/detection/actions/impact/provenance
      全在；optional 用了 detected_at_ref/severity/tags/notes。
      id 匹配 ^kb\.(fab|ap)\.[a-z0-9_]+$。
      5 条 possible_causes 的 likelihood 均在 {high,medium,low} 内，
      且每条 discriminator 写的都是"怎么和另一类区分"的可观测依据
      （时点与收敛方向 / 剖面形状 vs 均值 / 颗粒是否同步跃升 /
      边界是否清晰 / 腔压趋势是否同步），不是定义复述。
      cause_ref 五项与本提案的 5 条 may_cause 边的 from 端一一对应，
      符合 kb_schema 要求的"与 may_cause 的 from 端保持一致"。
      detection 三项 metric_ref 均为已存在 Metric，且 film_thickness 那条
      写明"只看片均值会漏掉均值在规格内、边缘已超规"——这是本条最实的一句。
      actions 四项 order 1-4 无重复，condition 都含不适用情形。
      impact.blocked_processes 两项与本提案的两条 blocks 边一致（已随
      blocks 的修正一并改过，原为 photo_coat）。
      notes 如实记了两点：数值刻意不写及其原因（实验条件不可换算）、
      以及本段仍缺的应力类异常缺口留给下一轮。

