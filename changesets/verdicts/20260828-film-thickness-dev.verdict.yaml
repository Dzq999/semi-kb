  - key: "fab.param.pvd_power|may_cause|fab.anomaly.film_thickness_dev"
    section: relations
    verdict: pass
    reason: >-
      端点类型合法（Parameter 在 may_cause 的 from 允许集内）。
      功率决定溅射产额进而决定沉积速率，全片同向偏移，是溅镀的基本关系，
      model_prior/high 恰当。此边同时让 CQ12（参数偏移会导致哪些异常）
