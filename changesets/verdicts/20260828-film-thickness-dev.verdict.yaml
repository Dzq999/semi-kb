# 全部条目 confidence 为 medium 或 high，无 low 实体条目
# （唯一的 low 是 analogous_to 关系的 provenance，如实反映 ext 端不可校验）。
# 本提案不含 schema 改动——未触碰 meta-schema.yaml，
# 亦未改 competency-questions.yaml 的既有条目（新问法只作为顶层
# competency_questions 段提出，等人工决定，不自行写入 in_scope）。
verdict: pass
