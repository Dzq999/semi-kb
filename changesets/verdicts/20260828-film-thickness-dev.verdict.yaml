  - key: "fab.param.chamber_pressure|may_cause|fab.anomaly.film_thickness_dev"
    section: relations
    verdict: pass
    reason: >-
      标 web/medium 而非 model_prior 是有依据的：页面正文给出 0.5 Pa 下
      2 eV 与 30 eV 溅射原子的平均自由程分别为 41.6 mm 与 113.7 mm，
      并据此解释靶基距超过自由程后散射使剖面趋平——即腔压通过自由程与散射
      改变剖面形状，而非仅改变整体厚度。note 写的正是这一层区分。
      数值本身刻意未写进本体（实验条件不可换算），只沉淀方向性机理。
      端点类型合法。

  - key: "fab.anomaly.film_thickness_dev|detected_at|fab.process.pvd_metal"
    section: relations
    verdict: pass
    reason: >-
      端点类型合法（Anomaly -> Process）。选 pvd_metal 而非新建一道膜厚量测
      工序，是刻意的建模取舍：该工序的 metrics 字段已含 film_thickness 与
      sheet_resistance，检出点落在沉积工序本身与既有建模一致（库内没有
      独立的膜厚量测 Process，膜厚是随线量测）。新建量测工序会牵动
      precedes 链与 Route.steps，改动面远大于收益。model_prior/high。

  - key: "fab.anomaly.film_thickness_dev|detected_at|fab.process.cvd_ild"
    section: relations
    verdict: pass
    reason: >-
      同上。cvd_ild 的 metrics 已含 film_thickness。两条 detected_at 并存是
      必要的：金属层与介电层的偏移后果不同（方阻 vs 层间电容与击穿裕度），
      kb 的 detection 与 impact 都据此分叙。model_prior/high。

  - key: "fab.anomaly.film_thickness_dev|mitigated_by|fab.action.chamber_season"
    section: relations
    verdict: pass
    reason: >-
      端点类型合法（Anomaly -> Action）。这是本轮新增动作的唯一出口边，
      配套 chamber_wall_condition 那条 may_cause——一因一果成对落地，
      避免出现"建了动作但图上无异常指向它"的孤立节点。
      note 限定适用分支（清洗/待机后的首片偏离），不被读成对所有膜厚偏移适用。
      web/medium 与实体一致。

  - key: "fab.anomaly.film_thickness_dev|mitigated_by|fab.action.recipe_adjust"
    section: relations
    verdict: pass
    reason: >-
      端点类型合法。既有动作复用而非新建，正确：recipe_adjust 的 description
