changeset: 20260828-film-thickness-dev.yaml
# 自审。生成方与审核方是同一上下文，如实标出——假装独立审过比自审更糟。
# 本轮网络工具可用：WebSearch 发现候选源，WebFetch 被域名核验层拦下
# （返回"Unable to verify if domain ... is safe to fetch"，不是站点 403），
# 故按 prompts/kb-refresh.md 的升级路径换 playwright 真实 Chrome 取正文。
# 两个 web ref 都是实际打开并读到正文的页面，不是检索结果里的链接照抄：
#   - https://doi.org/10.3390/molecules28227660 —— 页内 DOI 链接取得，
#     正文读到钟形/鞍形/线形剖面随靶基距 30→120 mm 演化、以及
#     U = 100% - 2(Hmax-Hmin)/(Hmax+Hmin)×100% 的均匀性定义
#   - https://patents.google.com/patent/US20060093756A1/en —— 标题与
#     受让人 Applied Materials Inc 已在页面确认，背景段读到
#     "residual material deposited on the chamber walls ... can affect the
#     deposition rate from substrate to substrate and the uniformity of the
#     deposition on the substrate ... can also detach ... create contaminating
#     particles"，这正是本轮两条 chamber_wall_condition 边的依据
# 选题依据当场从 common.load_entities/load_relations 重算，未复用上下文数字。
verifier: self:kb-refresh
verified_at: "2026-08-28"
items:
  - key: "fab.anomaly.film_thickness_dev"
    section: entities
    verdict: pass
    reason: >-
      选题锚点当场重算：按 Stage 统计 detected_at 覆盖，fab.stage.thinfilm 为 0
      ——该段有 3 道工序、2 个指标、4 个参数，却无任何 Anomaly 落点，
      fab.metric.film_thickness 是"有指标无异常判定它"的悬空指标。
      更硬的证据是假可答：`ask.py "薄膜沉积膜厚超规可能的根因有哪些"` 退出码 0、
      命中 CQ01，但顺答案路径走下去图上无对应节点。这属 project-notes 定义的
      "语义性空承诺"，比答不出来坏。
      与既有 18 个 Anomaly 逐条比对不重复：cd_out_of_spec 管横向关键尺寸
      （光刻/蚀刻后的线宽），本条管纵向厚度（沉积后的膜厚），量测手段
      （CD-SEM vs 椭偏/反射光谱）与所属段都不同；etch_residue 是去除不足的
      残留物，本条是沉积量偏差；cmp_scratch 是机械损伤；particle_excursion
      是颗粒计数。无覆盖。
      description 写的是判别形态（径向剖面形状 / 片间单调漂移 / 批间跳变 /
      首片偏离）而非定义复述，与库内既有 Anomaly 的写法一致。
      字段合规：id 中段 anomaly 与 type Anomaly 一致，domain fab 与前缀一致，
      severity high 合法，metrics 两项均为已存在 Metric，
      economic_hooks.affects 四项均在 allowed 集内。
      provenance 标 web/medium：ref 页面确实支撑"剖面形状随沉积几何演化"这条
      核心判别机理，但不支撑本条的全部内容（片间漂移与批间跳变来自模型知识），
      故取 medium 而非 high。

  - key: "fab.cause.target_erosion_profile"
    section: entities
    verdict: pass
    reason: >-
      与 fab.cause.target_end_of_life 的边界是本条最需要审的点，已在 description
      里显式写出：本条是渐变的剖面形状改变（沟槽尺寸演化改出射角分布），
      寿命末期是均匀性恶化叠加剥落颗粒风险跃升。两者判别信号不同
      （形状 vs 形状+颗粒同步跃升），处置分支也不同（可补偿 vs 必须换靶），
      建成两个节点才能让 kb 的 discriminator 有可写内容。若合成一个，
      "还能补偿"与"必须换靶"这条最贵的判断就丢了。
      与 chamber_polymer_buildup 不重复：那是蚀刻腔体聚合物累积，本条是靶面
      侵蚀几何。
      web/medium 有据：页面读到剖面随源尺寸与靶基距从钟形转鞍形再趋平坦，
      这正是 description 所述机理。刻意未写具体数值——源文献是 2/4 英寸靶、
      2 英寸基片，与 200/300 mm 量产腔体不可换算，照搬会得到看起来有据可查
      实际无效的工艺窗口。这也让 precheck 的 CITE_PAT lint 不会命中。
      economic_hooks.note 写的是"靶基距/功率补偿换沉积速率"的显式权衡，
      不是影响面复述。affects 三项合法。

  - key: "fab.cause.chamber_wall_condition"
    section: entities
    verdict: pass
    reason: >-
      与 chamber_polymer_buildup 的判别写在 description 里且方向相反，是可现场
      观测的硬区分：本条出现在清洗/长待机之后、随加工片数收敛；累积类出现在
      连续生产中、随片数发散。一张片间趋势图就能分开，不需要额外量测。
      web/medium 有据：US20060093756A1 背景段明确写残留物影响 substrate-to-
      substrate 沉积速率与片内均匀性，且脱落会产生污染颗粒——本条的两条
      may_cause 边（指向 film_thickness_dev 与 particle_excursion）都出自这一句，
      不是推演。取 medium 而非 high 因为"首片偏离随片数收敛"这一具体签名
      是模型知识补充的，专利未直接陈述。
      affects 三项合法；未写标准号或数值阈值。

  - key: "fab.action.chamber_season"
    section: entities
    verdict: pass
    reason: >-
      与 fab.action.chamber_clean 是否该分成两个动作，是本条的关键判断。
      分开正确：专利背景段明确 seasoning 是清洗且排空副产物之后单独执行的
      步骤（"Once the chamber has been sufficiently cleaned ... a seasoning step
      is typically performed"），两者目的不同（去除累积 vs 封住残留并回稳
      腔体热态），适用前提也不同——清洗针对发散型累积，预处理针对清洗后的
      首片偏离。合成一条会让 kb 的 condition 字段写不出可执行的区分。
      description 末句显式写明"是清洗之后的独立步骤，不是清洗的一部分"，
      供后来者不再纠结。
      与 replace_consumable 不重复（换耗材 vs 腔体预处理），
      与 recipe_adjust 不重复（改参数 vs 处理腔体状态）。
      affects [equipment_oee, yield] 合法；note 写的是"占机时不产出但省略会
      转成首片报废与颗粒缺陷"的取舍，不是复述。

  - key: "fab.cause.target_erosion_profile|may_cause|fab.anomaly.film_thickness_dev"
    section: relations
    verdict: pass
    reason: >-
      端点类型合法（Cause -> Anomaly，两端均在 may_cause 的允许集内）。
      语义是"因"不是"影响时长"：侵蚀沟槽演化直接改变基片上的厚度分布，
      异常因此发生，note 无 MTTR 类措辞，precheck 的 MTTR lint 不应命中。
      note 给的是机理而非结论重复。web/medium 与实体一致。

