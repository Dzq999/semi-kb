  - key: "ap.cause.efo_electrode_fouling|may_cause|ap.anomaly.wire_nsop"
    section: relations
    verdict: pass
    reason: >-
      结论：该条边可以放行。

      依据与验证过程：

      1) 一个 Cause 指向多个 Anomaly 有明确库内先例。读 `ontology/ap/relations/41-risk-graph.yaml`：`ap.cause.pad_contamination` 同时 may_cause `wire_nsop`(L18) 与 `delamination`(L55)；`ap.cause.emc_moisture` 同时指 `mold_void`(L33) 与 `delamination`(L54)；`ap.cause.blade_wear` 同时指 `dicing_chipping`(L63) 与 `die_crack`(L44)；`fixture_shortage` 同时指 `bonder_down`(L91) 与 `core.anomaly.wip_bubble`(L92)——后者正是「停机型+非停机型」跨类共存。故「同一 cause 跨向停机与质量两类异常」不违反建模惯例。

