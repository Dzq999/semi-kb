      3) model_prior 恰当。description 只给"按打线点数计数清洗/更换"这一维护惯例与判废逻辑，未写具体寿命阈值、标准号或设备参数，属工程惯例与本体结构决策，标 model_prior 正确。若后续要补入具体清洗周期数值，则需升级为 web 并核实正文。

