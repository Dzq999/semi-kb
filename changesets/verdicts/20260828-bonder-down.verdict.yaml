    reason: >-
      结论：ap.cause.efo_electrode_fouling 可通过。

      1) provenance 标 model_prior 恰当。描述「电极积附金属氧化物、随放电次数磨损、间隙漂移致无法稳定成球」全程无标准号、无具体参数值、无数值阈值，属定性失效机理与工程判别经验（报警集中在成球阶段而非焊接阶段、清洗后立即恢复），符合 knowledge/modeling-guide.md 第 51-66 行的 provenance 口径；ref 为 null 未编造 URL，候选线索只写进 kb_case 的 notes 并注明「URL 可达不等于正文支持」，态度诚实。若日后要写入清洗周期的具体点数门槛，才需升级为 web。

      2) 与 ap.cause.capillary_wear 不重复。读 36-causes-actions.yaml 第 21-29 行：瓷嘴磨损的劣化载体是瓷嘴端面/积屑，失效表现是超声能量传递效率变化导致拉力与剪切下降（economic_hooks 为 yield/cost_per_unit），判废按键合次数；本条载体是 EFO 放电电极，表现是成球失败报警致停机（hooks 为 equipment_oee/throughput/rework_rate），判废按累积放电次数与间隙漂移。一个是渐进质量劣化不必然停机，一个是急性停机，三项要素均不同。

      3) 与其余 9 条 cause 查重通过：pad_contamination、bond_param_drift、emc_moisture、blade_wear、grind_wheel_clog、epoxy_bleed、probe_card_wear、reflow_profile_drift、fixture_shortage 无一涉及 EFO 成球环节；grep 全 ontology 目录 efo|electrode|烧球|成球 仅命中 31 文件的工艺描述，无同义实体。

      4) 两条 may_cause 语义正确：均表示「导致异常发生」（成球失败触发停机、成球不良致不粘），非「决定停机多久」——时长方差的说法只出现在 economic_hooks.note 与 kb_case.impact，未被建成关系边，避开了上一轮备件延迟被 reject 的陷阱。meta-schema.yaml 第 50 行 may_cause 白名单 Cause→Anomaly 亦相符；41-risk-graph.yaml 第 18-23 行已有多条 cause 指向 wire_nsop，本条为新增不同成因，不冲突。

      验证方式：读提案 1-273 行、36-causes-actions.yaml 全文、meta-schema 第 50 行、modeling-guide 第 40-89 行、41-risk-graph 相关行；grep 查重与实体存在性（wire_nsop、bonder_down 均在 35-anomalies.yaml）。未修改任何文件，未创建临时脚本（仓库内既有 _tmp_* 文件非本次产生，按只读要求未触碰）。
