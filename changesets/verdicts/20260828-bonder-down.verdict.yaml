      2) 查重通过。读完 36 文件全部 10 条 ap cause（pad_contamination、capillary_wear、bond_param_drift、emc_moisture、blade_wear、grind_wheel_clog、epoxy_bleed、probe_card_wear、reflow_profile_drift、fixture_shortage），无一涉及送线；又对 ontology/ 全域 grep「送线|线材|断线|feed|spool|张力」，仅命中磨削/切割进给参数与线材批号，无重复 ID。与本提案同批的 efo_electrode_fouling（成球放电）、bond_head_servo_fault（轴系）也不重叠。

