# 下面只记需要判断的部分，每条写清我实际查了什么。
#
# 本轮与前几轮的一个实质差异：前几轮 verdict 记录"本环境出站 HTTPS 全不可用
# （curl 报 schannel SEC_E_NO_CREDENTIALS）"，因此一律标 model_prior。
# 本轮找到可用路径——本机代理 127.0.0.1:7890 + Python ssl 用 certifi 的
