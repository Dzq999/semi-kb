# 变更提案 · 键合机停机处置知识
changeset:
  id: 20260828-bonder-down
  title: 补齐键合机停机的根因、EFO 维护动作与排查 Playbook
  created_at: "2026-08-28"
  author: agent:kb-refresh
  rationale: |
    补的缺口与上一轮同类：高连通度异常无处置知识。从 build/index.json 重算
    （合并 scanner_down 后的最新状态）：18 个 Anomaly 中 13 个有 kb 实例，5 个没有。
    未覆盖项按度数排序，ap.anomaly.bonder_down 最高（度数 9，severity high），
    风险图谱里 may_cause / detected_at / mitigated_by / blocks / refines 都已接好，
    blocks 直接指向主流程 ap.route.qfn_wirebond_main，但排查指过来之后没有处置内容。
    本轮落 ap 域，与上一轮的 fab 域形成两域均衡。

    连带缺口：bonder_down 目前只有一条入边（ap.cause.fixture_shortage），
    而 fixture_shortage 是"有机台无治具"的排产型成因，不描述机台本身为什么停。
    ap 域 10 条 cause 全部是键合/塑封/切割的工艺缺陷型成因（焊垫污染、瓷嘴磨损、
    参数漂移等），没有一条描述打线机的停机机理，因此无法支撑
    "停多久、要不要改派、是耗材还是伺服"这类判断。本提案补 3 条停机根因与 1 条
    EFO 维护动作。

    provenance 说明（重要）：本轮 WebSearch 检索到了两个高相关来源——SEMI E10
    设备可靠性/可用性/可维护性标准页，以及一篇 EFO 电极磨损与表面污染的实验研究。
    但本环境的出站 HTTPS 全部不可用（连 example.com 都失败，schannel 报
    SEC_E_NO_CREDENTIALS），Invoke-WebRequest 与 curl 均无法取回正文。
    按 prompts/kb-refresh.md 的要求：拿不到确切正文就不填 web ref——
    填了也是"看起来可核查、实际没核过"的假证据，而且 check_refs.py 做的是真实
    urlopen，这种 ref 在当前网络下必然探测失败。故 13 条全部如实标 model_prior，
    候选 URL 只作为线索写进 kb_case 的 notes，等网络恢复后再按 web 升级。

    跨行业类比：本轮补的 bonder_down 与上一轮的 fab.anomaly.scanner_down 都属
    "瓶颈设备非计划停机"，共性明确（可用率损失不可回补、备件与保养是主要旋钮），
    故补一条 analogous_to 指向 ext.anomaly.bottleneck_outage，作为下一个行业冷启动
    的载体。注意 analogous_to 的 from/to 白名单不含 Cause/Action，
    所以类比只能建在 Anomaly 上，不能建在新增的 3 条 cause 上。

additions:
  entities:
    - target_file: ontology/ap/entities/36-causes-actions.yaml
      item:
        id: ap.cause.efo_electrode_fouling
        type: Cause
        name_zh: EFO 电极污染/磨损
        name_en: EFO Electrode Fouling & Wear
        domain: ap
        description: >
          打火烧球(EFO)电极积附金属氧化物并随放电次数磨损，放电间隙漂移后
          无法稳定成球，触发烧球失败报警并停机。特征是报警集中在成球阶段
          而非焊接阶段，且随打线点数累积逐渐加重，清洗或更换电极后立即恢复。
        economic_hooks:
          affects: [equipment_oee, throughput, rework_rate]
          note: 属可预测型劣化，清洗周期是停机频次与人力成本的权衡点
        provenance:
          source_type: model_prior
          ref: null
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

    - target_file: ontology/ap/entities/36-causes-actions.yaml
      item:
        id: ap.cause.wire_feed_jam
        type: Cause
        name_zh: 送线卡线/断线
        name_en: Wire Feed Jam & Wire Break
        domain: ap
        description: >
          线材在线轴、张力器或夹爪处缠绕、打结或断裂，导致送线中断而停机。
          与瓷嘴磨损的区别在于：卡线是突发的送线通路故障，穿线复位后即恢复；
          瓷嘴磨损是渐进的键合质量劣化，不必然停机。
        economic_hooks:
          affects: [equipment_oee, throughput]
          note: 单次停机短但频次高，累积可用率损失容易被低估
        provenance:
          source_type: model_prior
          ref: null
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

    - target_file: ontology/ap/entities/36-causes-actions.yaml
      item:
        id: ap.cause.bond_head_servo_fault
        type: Cause
        name_zh: 键合头伺服/Z 轴异常
        name_en: Bond Head Servo & Z-axis Fault
        domain: ap
        description: >
          键合头 Z 轴定位或超声换能器驱动异常，触发保护停机。
          判别依据是报警指向轴系或换能器自检，而非成球与送线环节；
          这类停机通常需原厂介入，不属厂内可自行恢复的耗材类停机。
        economic_hooks:
          affects: [equipment_oee, capacity_commit]
          note: 修复依赖外部资源，停机时长的方差远大于耗材类停机
        provenance:
          source_type: model_prior
          ref: null
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

    - target_file: ontology/ap/entities/36-causes-actions.yaml
      item:
        id: ap.action.clean_efo_electrode
        type: Action
        name_zh: 清洗/更换 EFO 电极
        name_en: Clean or Replace EFO Electrode
        domain: ap
        description: >
          按打线点数计数清洗或更换 EFO 电极，恢复放电间隙。
          与更换瓷嘴不同：瓷嘴管的是焊接界面质量，电极管的是成球稳定性，
          两者寿命周期与判废依据都不同，不能互相替代。
        economic_hooks:
          affects: [equipment_oee, rework_rate]
          note: 按计数预防性清洗可把非计划停机换成短时计划停机
        provenance:
          source_type: model_prior
          ref: null
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

