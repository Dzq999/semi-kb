changeset:
  id: 20260828-ball-placement-fixture
  title: 补植球治具孔位堵塞成因与清洁处置
  created_at: "2026-08-28"
  author: agent:kb-refresh
  rationale: |
    补的是"本体实体描述里明确列出的主因，图上却没有对应成因节点"这个洞。
    ap.anomaly.missing_ball 的 description 把'助焊剂涂布不均、植球治具孔位堵塞、
    回流曲线失当'并列为主因，但本体里只有对应助焊剂印刷的 flux_print_defect
    与对应回流侧的两条成因，'植球治具孔位堵塞'这条主因在图上无处落地。

    上一轮 20260828-missing-ball 的 verdict 已明确标注该处为刻意的遗留：
    '植球治具孔位堵塞这条实体描述里提到的成因仍无对应 Cause 实体（本轮已补
    印刷侧，治具侧需另找依据，凭空建等于把描述里的一句话升格成本体概念）'。
    本轮补的就是这个治具侧成因，把描述里的一句话真正建成可回溯的节点，
    并配一个对应的清洁处置动作，让 may_cause/mitigated_by 两条边落到图上，
    风险图谱回溯 missing_ball 时才不会被两条同源但机理不同的成因混为一谈。

    网络工具在本环境不可用（WebSearch/playwright 未授权），按来源策略老实标
    model_prior / medium——植球治具孔位被助焊剂残渣或错位锡球堵塞导致缺球，
    是封装常规模块知识，不为过闸门而伪装成 web 引用。

additions:
  entities:
    - target_file: ontology/ap/entities/36-causes-actions.yaml
      item:
        id: ap.cause.placement_fixture_clog
        type: Cause
        name_zh: 植球治具孔位堵塞
        name_en: Ball Placement Fixture Aperture Clogging
        domain: ap
        description: >
          植球治具/掩膜孔位被助焊剂残渣、错位或卡滞的锡球、或治具内壁积累物
          堵塞，导致锡球无法落位而出现缺球。判别要点：缺球位置与治具孔位呈
          固定一一对应（同一孔位反复缺、且批次间位置不漂移），而非跟印刷版面
          或炉内温区走。堵塞通常随使用次数累积渐进恶化，清洁或更换治具后
          立即恢复。与助焊剂印刷不良的关键区分：前者是*涂布环节*涂得对不对，
          本成因是*植球环节*孔位通不通——两者都作用于植球前，但失效部位与
          处置手段不同，不能合并。
        economic_hooks:
          affects: [yield, rework_rate]
          note: 治具清洁是计划性维护，纠正成本低于返工，堵塞率与清洁周期的权衡属耗材/维护决策
        provenance:
          source_type: model_prior
          ref: null
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

    - target_file: ontology/ap/entities/36-causes-actions.yaml
      item:
        id: ap.action.clean_placement_fixture
        type: Action
        name_zh: 清洁/更换植球治具
        name_en: Clean or Replace Ball Placement Fixture
        domain: ap
        description: >
          对植球治具/掩膜孔位做清洁除残渣，或用清洁替代件换上、对换下件排程
          深度清洁。换后须跑首件确认缺球消失。与 reball_rework 不同：本动作
          作用于治具（生产工具），纠正的是缺球的上游成因；reball_rework 作用于
          已缺球的成品，是产品级返工。两者一因一果，处置对象不同。
        economic_hooks:
          affects: [yield, rework_rate, equipment_oee]
          note: 按堵塞累积频率排程清洁，把非计划停机换成可控维护，同时从源头压低缺球率
        provenance:
          source_type: model_prior
          ref: null
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

  relations:
    - target_file: ontology/ap/relations/41-risk-graph.yaml
      item:
        from: ap.cause.placement_fixture_clog
        type: may_cause
        to: ap.anomaly.missing_ball
        note: 孔位堵塞致锡球无法落位；缺球位置与孔位固定对应，批次间不漂移
        provenance:
          source_type: model_prior
          ref: null
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

    - target_file: ontology/ap/relations/41-risk-graph.yaml
      item:
        from: ap.anomaly.missing_ball
        type: mitigated_by
        to: ap.action.clean_placement_fixture
        note: 针对治具孔位堵塞这一成因分支，清洁后可治本；产品级返工仍需 reball_rework
        provenance:
          source_type: model_prior
          ref: null
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null
