        note: 背面颗粒致局部抬升，偏移呈局部化不规则分布
        provenance: {source_type: model_prior, ref: null, confidence: medium, created_at: "2026-08-28", reviewed_by: null}
    - target_file: ontology/fab/relations/21-risk-graph.yaml
      item:
        from: fab.cause.lens_heating_drift
        type: may_cause
