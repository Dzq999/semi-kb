# 变更提案 · 光刻机非计划停机处置知识
changeset:
  id: 20260828-scanner-down
  title: 补齐光刻机非计划停机的根因、处置动作与排查 Playbook
  created_at: "2026-08-28"
  author: agent:kb-refresh
  rationale: |
    补的缺口是"高连通度异常无处置知识"。从 build/index.json 重算：19 个 Anomaly
    中 13 个有 kb 实例，6 个没有；未覆盖项里 fab.anomaly.scanner_down 度数最高（9），
    severity critical，风险图谱里 detected_at / blocks / refines / may_cause 都已接好，
    blocks 直接指向主流程 fab.route.cmos_logic_main，但排查指过来之后没有任何处置内容。

    连带缺口：现有 fab.cause.* 全部是工艺缺陷型根因（沾污、温度不均、批号切换等），
    没有任何一条描述"设备为什么停机"，因此 scanner_down 在图上只有一条 mitigated_by
    （skip_ahead），无法支撑"停多久、要不要改道、什么时候升级"这类判断。
    本提案补 3 条停机根因与 1 条停机专属动作，再用它们支撑 Playbook。

    provenance 说明：本次 WebSearch 未取到可验证的停机根因分类原文（返回结果多为
    EUV sub-fab、TEL track 案例等旁支主题），按 kb-refresh 规范不编造 URL，
    全部如实标 model_prior / confidence medium，等后续拿到 SEMI E10 等标准原文再升级。

    第二版（首轮 subAgent 审核 13 条全 reject 后修订），改了三处：
    1. 删掉 5 条实体上的 equipment 字段。meta-schema 的 derived_relations 规定
       equipment 按 value -> entity 派生 belongs_to，而 belongs_to 的 to 端只允许
       [Stage, Process]，指向 Cause/Action 违反 R005。已复核：全库 44 处 equipment
       字段无一例外都在 Process 上。更要紧的是 validate.py 只校验显式关系，
       而 build_index 把派生关系一起入图——这批非法边不会报错却会静默写进图。
       设备关联已由 photo_exposure.equipment 加 detected_at 边表达，无需重复。
    2. 撤掉 fab.cause.spare_part_shortage 实体与其 may_cause 边，理由见 kb_case 的 notes。
    3. 撤掉 fab.action.rebalance_dispatch，与已有 fab.action.skip_ahead 重复
       （原文已含"改派至替代机台或调整工序顺序，用于缓解 WIP 堆积"，
       且 scanner_down mitigated_by skip_ahead 已存在于 21-risk-graph.yaml）。
       其"改派需确认套刻补正模型按机台管理"这一有效信息已并入 kb_case 的
       skip_ahead condition，不另建实体。

additions:
  entities:
    - target_file: ontology/fab/entities/17-causes-actions.yaml
      item:
        id: fab.cause.reticle_stage_error
        type: Cause
        name_zh: 光罩台/工件台伺服异常
        name_en: Reticle & Wafer Stage Servo Error
        domain: fab
        description: >
          双工件台同步扫描依赖纳米级伺服跟随，编码器、气浮或温控偏差会触发
          扫描中断报警并锁机。特征是报警集中于扫描动作阶段而非曝光光源侧，
          且常伴随特定 slit 位置重复出现。
        economic_hooks:
          affects: [equipment_oee, throughput, capacity_commit]
          note: 停机时长直接扣减瓶颈机台可用工时，产能承诺随之失守
        provenance:
          source_type: model_prior
          ref: null
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

    - target_file: ontology/fab/entities/17-causes-actions.yaml
      item:
        id: fab.cause.light_source_degradation
        type: Cause
        name_zh: 曝光光源功率衰减/熄灭
        name_en: Light Source Power Degradation
        domain: fab
        description: >
          准分子激光或 EUV 光源功率随累积脉冲衰减，跌破配方所需剂量下限时
          曝光被拒或需延长扫描时间。区别于伺服类停机：产出率先缓慢下降，
          再转为硬停机，属可预测型劣化。
        economic_hooks:
          affects: [equipment_oee, throughput, cost_per_unit]
          note: 换管/换模块为计划性支出，提前换损失产能、延后换风险硬停机
        provenance:
          source_type: model_prior
          ref: null
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

    - target_file: ontology/fab/entities/17-causes-actions.yaml
      item:
        id: fab.cause.pm_overdue
        type: Cause
        name_zh: 预防保养逾期
        name_en: Preventive Maintenance Overdue
        domain: fab
        description: >
          瓶颈机台的 PM 常因赶产被推迟，逾期后非计划停机概率显著上升。
          判别依据是停机前 PM 计划已超期，而非任何硬件突发信号——
          这类停机本质是排程决策的后果，不是设备故障。
        economic_hooks:
          affects: [equipment_oee, rework_rate]
          note: 用计划停机换非计划停机，是可主动选择的权衡而非不可控事件
        provenance:
          source_type: model_prior
          ref: null
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

    - target_file: ontology/fab/entities/17-causes-actions.yaml
      item:
        id: fab.action.dispatch_field_service
        type: Action
        name_zh: 报修并催派原厂工程师
        name_en: Dispatch Field Service Engineer
        domain: fab
        description: >
          开设备工单并按合约响应等级升级催派。适用于原厂锁定模块，
          厂内自行处理会失去保修或造成二次损伤的情形。
        economic_hooks:
          affects: [equipment_oee, capacity_commit]
          note: 响应等级在合约签订时就已决定，停机当下无法改变
        provenance:
          source_type: model_prior
          ref: null
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

