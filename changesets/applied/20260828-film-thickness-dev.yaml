changeset:
  id: 20260828-film-thickness-dev
  title: 补齐薄膜沉积段的膜厚偏移异常、腔体/靶材类根因与排查 Playbook
  created_at: "2026-08-28"
  author: agent:kb-refresh
  rationale: |
    补的缺口是"整个制程段在风险图上没有任何异常节点"。选题依据当场从
    common.load_entities / load_relations 重算（不复用上下文里的数字）：

      18 个 Anomaly 中 16 个有 kb 实例，剩下 2 个是
      core.anomaly.equipment_down 与 core.anomaly.quality_excursion——
      kb_schema 的 id_pattern 是 ^kb\.(fab|ap)\.，core 域按设计不写 kb 实例，
      所以"无 kb 实例的异常"这条缺口实际已经补完，不是本轮的选题来源。

      按 Stage 统计异常检出覆盖，fab.stage.thinfilm 是 0：该段有 3 道工序
      （pvd_metal / cvd_ild / ald_barrier）、2 个指标（film_thickness /
      sheet_resistance）、4 个参数（chamber_pressure / pvd_power 等），
      却没有任何 Anomaly 落在这一段。fab.metric.film_thickness 因此是
      "有指标、无异常判定它"的悬空指标。

    后果不是少一条知识，而是 CQ01/CQ04 对这一段会给出假可答：
    `ask.py "薄膜沉积膜厚超规可能的根因有哪些"` 退出码 0、判定命中 CQ01，
    但图上根本没有 film thickness 类异常节点，顺着答案路径走下去是空的。
    清单承诺了库答不出的东西，这正是 project-notes 里"语义性空承诺"那一类。

    本轮补一个异常节点 + 两个该段特有的根因 + 一个 seasoning 动作，
    把 thinfilm 段接进风险图谱，并补写 Playbook 让排查有落点。
    两个根因都取自公网可核查资料，判别依据写的是"怎么和另一类区分"，
    不是复述定义。

additions:
  entities:
    - target_file: ontology/fab/entities/16-anomalies.yaml
      item:
        id: fab.anomaly.film_thickness_dev
        type: Anomaly
        name_zh: 膜厚偏移/均匀性超规
        name_en: Film Thickness Deviation
        domain: fab
        severity: high
        description: >
          沉积膜层厚度偏离目标值或片内均匀性超标。判别要点在偏移的时空形态：
          片内径向剖面形状（中心厚的钟形 / 边缘厚的鞍形）指向沉积源几何与
          靶材侵蚀轮廓，片间单调漂移指向耗材寿命或腔体壁累积，
          批间跳变且边界清晰指向配方误用，同腔首片偏离而后续回稳指向
          腔体状态未预处理。
        metrics: [fab.metric.film_thickness, fab.metric.sheet_resistance]
        economic_hooks:
          affects: [yield, rework_rate, scrap_rate, cycle_time]
          note: >
            介电层膜厚偏移直接改变层间电容与击穿裕度，金属层偏移改变方阻，
            两者都要到 WAT/CP 才充分暴露，检出延迟长；且膜厚不足无法回补，
            过厚只有少数层可靠 CMP 修正，多数情况下只能判废
        provenance:
          source_type: web
          ref: https://doi.org/10.3390/molecules28227660
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

    - target_file: ontology/fab/entities/17-causes-actions.yaml
      item:
        id: fab.cause.target_erosion_profile
        type: Cause
        name_zh: 靶材侵蚀轮廓演化
        name_en: Target Erosion Groove Evolution
        domain: fab
        description: >
          磁场把等离子体约束在闭合跑道区，靶面被局部而非均匀溅蚀，随使用
          形成并加深侵蚀沟槽。沟槽尺寸变化会改变有效溅射源的几何与出射角
          分布，从而改变基片上的膜厚径向剖面——文献中随源尺寸/靶基距变化
          可从中心厚的钟形转为边缘厚的鞍形，再趋于平坦。与靶材寿命末期的
          判别在于：本项是渐变的剖面形状改变，寿命末期是均匀性恶化叠加
          剥落颗粒风险跃升。
        economic_hooks:
          affects: [yield, cost_per_unit, equipment_oee]
          note: >
            可用靶基距或功率补偿一段时间，代价是沉积速率下降（产能）；
            换靶恢复剖面但消耗耗材成本与停机时间——这是耗材利用率与
            均匀性之间的显式权衡点
        provenance:
          source_type: web
          ref: https://doi.org/10.3390/molecules28227660
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

    - target_file: ontology/fab/entities/17-causes-actions.yaml
      item:
        id: fab.cause.chamber_wall_condition
        type: Cause
        name_zh: 腔体壁沉积状态未预处理
        name_en: Unconditioned Chamber Wall State
        domain: fab
        description: >
          清洗后未做 seasoning、或 seasoning 膜与后续制程不匹配时，腔体内壁与
          零件的残留状态会同时影响片间沉积速率与片内均匀性，残留物脱落还会
          转为颗粒污染。表现签名是清洗或长时间待机后的首片偏离、随后逐片
          回稳。与腔体聚合物累积的判别在于时点与方向：本项出现在清洗/待机
          之后且随加工片数收敛，累积类出现在长时间连续生产中且随片数发散。
        economic_hooks:
          affects: [yield, equipment_oee, cost_per_unit]
          note: >
            seasoning 消耗机时与气体但不产出产品，属显式的良率换产能取舍；
            省掉它换来的产能会以首片报废和颗粒风险的形式还回去
        provenance:
          source_type: web
          ref: https://patents.google.com/patent/US20060093756A1/en
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

    - target_file: ontology/fab/entities/17-causes-actions.yaml
      item:
        id: fab.action.chamber_season
        type: Action
        name_zh: 腔体预处理（seasoning）
        name_en: Chamber Seasoning
        domain: fab
        description: >
          清洗后按制程配方在腔体内壁与零件上沉积一层预处理膜，封住残留
          污染物并使腔体热态与沉积环境回到稳态，之后跑验证片确认膜厚与
          均匀性恢复再放行量产。是清洗之后的独立步骤，不是清洗的一部分。
        economic_hooks:
          affects: [equipment_oee, yield]
          note: 占用机时且不产出，但省略它会把成本转移成首片报废与颗粒缺陷
        provenance:
          source_type: web
          ref: https://patents.google.com/patent/US20060093756A1/en
          confidence: medium
          created_at: "2026-08-28"
          reviewed_by: null

