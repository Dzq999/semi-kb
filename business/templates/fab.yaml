schema_version: "2.0"
template:
  id: template.fab
  name: 晶圆厂领域模块
  extends: [business/templates/semiconductor.yaml]
  variables:
    - {id: wafer_starts, unit: wafer/month}
    - {id: dies_per_wafer, unit: die/wafer}
    - {id: lithography_capacity, unit: wafer/month}
    - {id: etch_capacity, unit: wafer/month}
    - {id: cmp_capacity, unit: wafer/month}
  calculations:
    - id: fab_bottleneck_wafers
      algorithm: capacity.bottleneck
      inputs: [wafer_starts, lithography_capacity, etch_capacity, cmp_capacity]
      unit: wafer/month
