schema_version: "2.0"
template:
  id: template.ap
  name: 半导体封装测试领域模块
  extends: [business/templates/semiconductor.yaml]
  variables:
    - {id: assembly_yield, unit: ratio}
    - {id: die_attach_yield, unit: ratio}
    - {id: bonding_yield, unit: ratio}
    - {id: molding_yield, unit: ratio}
    - {id: ball_placement_yield, unit: ratio}
    - {id: rework_rate, unit: ratio}
    - {id: scrap_rate, unit: ratio}
    - {id: equipment_oee, unit: ratio}
  calculations:
    - id: assembly_yield
      algorithm: yield.cascade
      inputs: [die_attach_yield, bonding_yield, molding_yield, ball_placement_yield]
      unit: ratio
      override: true
